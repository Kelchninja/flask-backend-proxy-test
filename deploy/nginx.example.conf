# Example reverse proxy configuration for this backend (nginx).
# Adjust upstream address, server_name and TLS paths for your setup.

upstream flask_backend {
    server 127.0.0.1:8000;
    keepalive 32;                 # reuse connections; backend keepalive is 15s
}

server {
    listen 80;
    server_name proxy.example.com;

    # Fail fast on huge uploads instead of buffering them to disk first.
    client_max_body_size 16m;

    location / {
        proxy_pass http://flask_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # These four are what /api/whoami and /api/echo verify.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Correlate proxy and backend logs; the backend echoes this header back.
        proxy_set_header X-Request-ID      $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;   # /api/delay/70 must hit this timeout
    }

    # Streaming endpoints: without this nginx buffers the whole response and
    # /api/stream and /api/sse appear to arrive all at once.
    location ~ ^/api/(sse|stream) {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }
}

# --- If the proxy strips a path prefix (e.g. /backend) ------------------------
# location /backend/ {
#     proxy_pass http://flask_backend/;          # trailing slash strips /backend
#     proxy_set_header X-Forwarded-Prefix /backend;
#     ...
# }
# Then start the backend with PROXY_FIX_X_PREFIX=1 so redirects and generated
# URLs keep the prefix.
