# Optional: backend plus an nginx reverse proxy, for a self-contained test bed.
#   docker compose up --build   ->  proxy on http://localhost:8080
services:
  backend:
    build: .
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:-insecure-development-key-change-me}
      INSTANCE_ID: backend-1
      LOG_FORMAT: json
      # The proxy is a container in this network, not 127.0.0.1.
      FORWARDED_ALLOW_IPS: "*"
      PROXY_FIX_X_FOR: "1"
      PROXY_FIX_X_PROTO: "1"
      PROXY_FIX_X_HOST: "1"
    expose:
      - "8000"
    # Uncomment to reach the backend directly and compare with the proxied view.
    # ports:
    #   - "8000:8000"

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
