[project]
name = "flaskbackendtest"
version = "0.1.0"
description = "Minimal, production-ready Flask backend for reverse proxy testing"
readme = "README.md"
authors = [
    { name = "Kelchninja", email = "peterderallerechte27@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=23.0.0",
]

[project.scripts]
flaskbackendtest = "flaskbackendtest.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
